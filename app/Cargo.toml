[package]
name = "ghostcaret"
description = "ghostcaret desktop and mobile app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ghostcaret_lib"

[features]
default = ["local"]
# Local inference through llama.cpp.
local = ["dep:ghostcaret-local", "ghostcaret-runtime/local"]
# GPU backends for llama.cpp.
cuda = ["local", "ghostcaret-local?/cuda"]
vulkan = ["local", "ghostcaret-local?/vulkan"]
# llama.cpp CPU backends as DLLs with run-time selection of the best variant
# for the processor (the Windows release build; ship the DLLs beside the exe).
dynamic-backends = ["local", "ghostcaret-local?/dynamic-backends"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
ghostcaret-engine.workspace = true
ghostcaret-cloud.workspace = true
ghostcaret-store.workspace = true
ghostcaret-local = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
log.workspace = true
tauri = { version = "2.12", features = [] }
directories = "6"
keyring = "4"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
ghostcaret-platform.workspace = true
ghostcaret-runtime.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints]
workspace = true
