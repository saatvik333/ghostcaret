[package]
name = "oft-android-harness"
description = "The keyboard's native library for the standalone Android harness"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Named like the Tauri app's library, so the keyboard module loads either.
[lib]
name = "open_flowtype_lib"
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
oft-platform = { path = "../../../crates/platform" }

# Its own workspace: the harness builds only for Android, with cargo-ndk.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"
