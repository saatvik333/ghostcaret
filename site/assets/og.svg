<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <title>Ghostcaret: Autocomplete at your cursor, on a model you choose. In development, not released yet.</title>
  <rect width="1200" height="630" fill="#111215"/>
  <circle cx="84" cy="84" r="9" fill="#f0a63a"/>
  <text x="108" y="94" font-family="'JetBrains Mono','JetBrainsMono Nerd Font',ui-monospace,monospace" font-size="28" fill="#f0a63a">In development. Not released yet.</text>
  <g font-family="'Noto Sans','Inter','DejaVu Sans',sans-serif" font-size="88" font-weight="700" letter-spacing="-1.5">
    <text x="72" y="250" xml:space="preserve"><tspan fill="#ecebe5">Autocomplete at your</tspan></text>
    <text x="72" y="350" xml:space="preserve"><tspan fill="#ecebe5">cursor</tspan><tspan fill="#f0a63a" font-weight="400">|</tspan><tspan fill="#8c8c97">, on a model</tspan></text>
    <text x="72" y="450" xml:space="preserve"><tspan fill="#8c8c97">you choose.</tspan></text>
  </g>
  <g transform="translate(72 530)">
    <rect width="48" height="48" rx="11" fill="#17171b" stroke="#2c2f37"/>
    <rect x="13" y="10" width="4.5" height="28" rx="2.2" fill="#f0a63a"/>
    <rect x="22" y="22" width="14" height="4.5" rx="2.2" fill="#b9b9c2" opacity="0.75"/>
    <rect x="39" y="22" width="4.5" height="4.5" rx="2.2" fill="#b9b9c2" opacity="0.4"/>
  </g>
  <text x="140" y="565" font-family="'JetBrains Mono','JetBrainsMono Nerd Font',ui-monospace,monospace" font-size="34" font-weight="700" fill="#ecebe5">Ghostcaret</text>
</svg>
