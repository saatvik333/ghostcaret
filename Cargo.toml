[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/local",
    "crates/cloud",
    "crates/platform",
    "crates/render",
    "crates/bench",
    "app",
]
default-members = ["crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.90"
repository = "https://github.com/saatvik333/open-flowtype"

[workspace.dependencies]
oft-engine = { path = "crates/engine" }
oft-local = { path = "crates/local" }
oft-cloud = { path = "crates/cloud" }
oft-platform = { path = "crates/platform" }
oft-render = { path = "crates/render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
crossbeam-channel = "0.5"
thiserror = "2"
log = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Readability over tool appeasement: these flag clear code.
needless_return = "allow"
too_many_arguments = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
