name: Pages

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
  workflow_dispatch:

# Deploy only what the Pages actions need. Each job asks for its own extra permissions.
permissions:
  contents: read

# One deployment at a time. A running deployment finishes instead of being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Test the demo engine
        run: bun test site
      - name: Build the site
        run: bun site/build.ts --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
