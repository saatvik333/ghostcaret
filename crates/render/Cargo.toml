[package]
name = "ghostcaret-render"
description = "Software renderer for the suggestion overlay and the Reply & rewrite card"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ghostcaret-engine.workspace = true
# Shaping (including complex scripts), font fallback per cluster, line-break
# analysis, hinted scaling and colour-emoji rasterising in one pure-Rust
# crate. Alternatives: cosmic-text bundles swash plus rustybuzz and a fontdb
# scan of every installed font at start-up; freetype and harfbuzz are C and
# absent on Windows.
swash = { version = "0.2.6", default-features = false, features = ["std", "render"] }
# Font files are mapped rather than read, so a 20 MB CJK collection costs
# only the pages actually touched.
memmap2 = "0.9"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
