[package]
name = "oft-runtime"
description = "The runtime that drives the engine controller: worker threads, timers, models, stores"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Local inference through llama.cpp. Without it, settings that choose a
# local model report that this build has none.
local = ["dep:oft-local"]

[dependencies]
oft-engine.workspace = true
oft-cloud.workspace = true
oft-store.workspace = true
oft-local = { workspace = true, optional = true }
crossbeam-channel.workspace = true
serde.workspace = true
log.workspace = true

# The local time zone, for pause end times and the daily cloud cap.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_SystemServices", "Win32_System_Time"] }

[lints]
workspace = true
