[package]
name = "ghostcaret-bench"
description = "Replay benchmark: keystroke savings, wrong-suggestion rate and latency"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# GPU backends of the local model, passed through to ghostcaret-local.
cuda = ["ghostcaret-local/cuda"]
vulkan = ["ghostcaret-local/vulkan"]
metal = ["ghostcaret-local/metal"]

[dependencies]
ghostcaret-engine.workspace = true
ghostcaret-local.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
unicode-segmentation = "1.12"

[lints]
workspace = true
